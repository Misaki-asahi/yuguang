<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title>
<style>
  :root{
    --ink:#1F2937; --sub:#5B6675; --muted:#8A94A3; --navy:#1F4E79;
    --accent:#B45309; --line:#E5E9EF; --bg:#FBFBFC; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:980px;margin:0 auto;padding:48px 32px 72px}
  h1,h2{font-family:"Microsoft YaHei",sans-serif}

  /* ---------- 头部 ---------- */
  .head{display:flex;justify-content:space-between;align-items:flex-end;
        border-bottom:2px solid var(--navy);padding-bottom:16px;margin-bottom:28px;gap:24px}
  .brand{color:var(--accent);font-size:13px;letter-spacing:.12em;margin-bottom:8px}
  .head h1{font-size:34px;margin:0;font-weight:700;letter-spacing:.01em}
  .head-right{display:flex;gap:28px;text-align:right}
  .head-right b{display:block;font-size:20px;font-weight:700;color:var(--navy)}
  .head-right span{font-size:12px;color:var(--muted)}

  /* ---------- 一句话结论 ---------- */
  .conclusion{background:var(--card);border-left:4px solid var(--accent);
              padding:22px 26px;border-radius:4px;box-shadow:0 1px 2px rgba(16,24,40,.05);
              margin-bottom:24px}
  .conclusion .line{font-size:19px;line-height:1.6;margin:0 0 8px}
  .conclusion .sub{color:var(--sub);font-size:13px;margin:0}

  /* ---------- 指标卡 ---------- */
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:36px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
  .card b{display:block;font-size:22px;font-weight:700;color:var(--navy);margin-bottom:4px}
  .card span{font-size:12px;color:var(--muted)}
  .card small{display:block;font-size:11px;color:var(--sub);margin-top:6px}

  h2{font-size:15px;color:var(--navy);margin:0 0 14px;letter-spacing:.04em}
  section{margin-bottom:36px}

  /* ---------- 时间轴 ---------- */
  .ruler{position:relative;height:18px;margin-bottom:4px}
  .ruler i{position:absolute;font-style:normal;font-size:10px;color:var(--muted);
           transform:translateX(-50%);top:0}
  .track{position:relative;height:64px;background:#F1F3F6;border-radius:4px;overflow:hidden;
         border:1px solid var(--line)}
  .blk{position:absolute;top:0;bottom:0;display:block;text-decoration:none;
       transition:filter .12s}
  .blk:hover{filter:brightness(1.12)}
  .blk.gap{background:repeating-linear-gradient(45deg,#E3E7EC 0 4px,#EDF0F3 4px 8px)}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px}
  .legend div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
  .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
  .legend em{font-style:normal;color:var(--muted);margin-left:2px}

  /* ---------- 明细 ---------- */
  details.row{background:var(--card);border:1px solid var(--line);border-radius:6px;
              margin-bottom:8px;overflow:hidden}
  details.row>summary{display:grid;grid-template-columns:104px 10px 1fr 92px 18px;
                      gap:14px;align-items:center;padding:12px 16px;cursor:pointer;
                      list-style:none}
  details.row>summary::-webkit-details-marker{display:none}
  details.row[open]>summary{border-bottom:1px solid var(--line)}
  .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .what b{font-size:12px;color:var(--navy);font-weight:700;margin-right:10px}
  .what span{font-size:13px;color:var(--ink)}
  .d{font-size:12px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
  .chev{width:0;height:0;justify-self:center;
        border-left:4px solid transparent;border-right:4px solid transparent;
        border-top:5px solid var(--muted);transition:transform .15s}
  details.row[open] .chev{transform:rotate(180deg)}
  .ev{padding:14px 16px 16px;background:#FCFCFD;display:grid;
      grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
  .ev p{margin:0;font-size:12.5px;line-height:1.75;color:var(--sub)}
  .ev img{width:100%;border-radius:4px;border:1px solid var(--line);display:block}
  .ev .none{font-size:12px;color:var(--muted)}

  /* ---------- 建议 ---------- */
  .suggest{background:#FDF7F1;border:1px solid #F3E2D0;border-radius:6px;padding:20px 24px}
  .suggest h2{color:var(--accent)}
  .suggest p{margin:0;font-size:15px;line-height:1.7}

  footer{border-top:1px solid var(--line);padding-top:14px;font-size:11.5px;color:var(--muted);
         display:flex;justify-content:space-between;gap:16px}

  @media (max-width:760px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .head{flex-direction:column;align-items:flex-start}
    .ev{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<main class="page">

  <header class="head">
    <div>
      <div class="brand">余光 · 今日时间账单</div>
      <h1>$date_cn</h1>
    </div>
    <div class="head-right">
      <div><b>$tracked</b><span>在电脑前</span></div>
      <div><b>$focus</b><span>深度专注</span></div>
      <div><b>$switches</b><span>切换次数</span></div>
    </div>
  </header>

  <section class="conclusion">
    <p class="line">$summary</p>
    <p class="sub">$sub_line</p>
  </section>

  <section class="cards">
    $cards
  </section>

  <section>
    <h2>时间轴</h2>
    <div class="ruler">$ruler</div>
    <div class="track">$timeline</div>
    <div class="legend">$legend</div>
  </section>

  <section>
    <h2>每一段（点开看证据）</h2>
    $blocks
  </section>

  <section class="suggest">
    <h2>明天只做一件事</h2>
    <p>$suggestion</p>
  </section>

  <footer>
    <span>余光 v$version · 本地生成，不上传</span>
    <span>$footer_right</span>
  </footer>

</main>
</body>
</html>
